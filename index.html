<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>JS Data Explorer</title>
</head>
<body>
    <div>
        <input type="file" id="uploadFile" accept=".csv"/>
        <div id="loader" class='hidden'>Loading...</div>

        <div class="flex items-center gap-2">
            <button id="prevPage" class="ml-2 px-3 py-1 border rounded hover:bg-gray-300">
                &lt;
            </button>

            <div class="flex items-center gap-1">
                <input type="number" id="pageNum" value="1" min="1" class="w-16 px-2 py-1 border rounded text-center focus:outline-none focus:ring-2 "/>
                <span class="text-gray-500">/ 10</span>
            </div>

            <button id="nextPage" class="px-3 py-1 border rounded hover:bg-gray-300">
                &gt;
            </button>
        </div>

        <div id="tableContent" class="overflow-x-auto p-6">
            <table id="table" class="min-w-full table-fixed border border-gray-300">
                <thead id="table-head" class="bg-gray-100"></thead>
                <tbody id="table-body" class="divide-y"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
