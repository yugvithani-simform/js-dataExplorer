<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous"
    >
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>JS Data Explorer</title>
</head>
<body>
    <div>
        <input type="file" id="uploadFile" accept=".csv"/>
        <div id="loader" class='hidden'>Loading...</div>

        <div id="paginationSection" class="items-center gap-2 hidden">

            <select id="pageOffset" class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>

            <button id="prevPage" class="ml-2 px-3 py-1 border rounded hover:bg-gray-300">
                &lt;
            </button>

            <div class="flex items-center gap-1">
                <input type="number" id="pageNo" value="1" min="1" class="w-16 px-2 py-1 border rounded text-center focus:outline-none focus:ring-2 "/>
                <span id="totalPage" class="text-gray-500">/ 1</span>
            </div>

            <button id="nextPage" class="px-3 py-1 border rounded hover:bg-gray-300">
                &gt;
            </button>
        </div>

        <div id="tableContent" class="overflow-x-auto p-6">
            <table id="table" class="min-w-full table-fixed border border-gray-300">
                <thead id="table-head" class="bg-gray-100"></thead>
                <tbody id="table-body" class="divide-y"></tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
